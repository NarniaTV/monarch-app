name: monarch
description: "SYSTEM: AWAKEN - Aplicativo de produtividade com sistema de ranks, stats e shadow system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # Storage & Local Data
  shared_preferences: ^2.3.2
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  
  # Google Services
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # Fontes são carregadas via google_fonts (Orbitron e Share Tech Mono)
  # Se preferir usar fontes locais, descomente e adicione os arquivos .ttf em assets/fonts/
  # fonts:
  #   - family: Orbitron
  #     fonts:
  #       - asset: assets/fonts/Orbitron-Regular.ttf
  #       - asset: assets/fonts/Orbitron-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Orbitron-Black.ttf
  #         weight: 900
  #   - family: ShareTechMono
  #     fonts:
  #       - asset: assets/fonts/ShareTechMono-Regular.ttf
